name: CI - Open Transit Sim

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  backend-check:
    name: Validar Back-end (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Verificar qualidade e sintaxe do código (Ruff)
        run: ruff check backend/

      - name: Testar importação dos módulos
        run: |
          cd backend
          python -c "import main, graph_engine; print('Módulos carregados com sucesso!')"
          
  frontend-check:
    name: Validar Front-end (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Verificar tipagem e build de produção
        working-directory: frontend
        run: npm run build